# Updates als Pull Request: Python-Pakete, das Basis-Image (per Digest festgelegt) und die GitHub Actions
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
